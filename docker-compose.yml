services:

  database:
    image: postgres:17
    container_name: trabalho-database

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - dados_postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"


  backend:
    build: ./backend
    container_name: trabalho-backend

    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5000:5000"

    depends_on:
      - database


  frontend:
    build: ./frontend
    container_name: trabalho-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  dados_postgres:
