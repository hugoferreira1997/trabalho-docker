services:

  database:
    image: postgres:17

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - dados_postgres:/var/lib/postgresql/data

  backend:
    build: ./backend

    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      - database

  frontend:
    build: ./frontend

    expose:
      - "80"

    depends_on:
      - backend

volumes:
  dados_postgres:
